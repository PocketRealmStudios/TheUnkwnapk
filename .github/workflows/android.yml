name: Release TheUnkwn APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: theunkwn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build signed TheUnkwn APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Extract and verify Android project
        shell: bash
        run: |
          set -euo pipefail
          archive='./TheUnkwn.zip'
          if [[ -f "$archive" ]]; then
            # Keep the archive name exact and extract into a clearly named folder.
            extraction_dir="$RUNNER_TEMP/TheUnkwn"
            rm -rf "$extraction_dir"
            mkdir -p "$extraction_dir"
            echo "Extracting TheUnkwn.zip into folder: TheUnkwn/"
            unzip -oq "$archive" -d "$extraction_dir"
            cp -a "$extraction_dir/." .
          elif [[ ! -f app/build.gradle.kts && ! -f app/build.gradle ]]; then
            echo "ERROR: TheUnkwn.zip was not found and the Android app module is missing. Add exactly TheUnkwn.zip or commit the extracted project files at the repository root."
            exit 1
          fi

          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f build-with-bundled-gradle.sh
          test -f app/src/main/res/drawable-nodpi/brand_backdrop.webp
          test -f app/src/main/res/drawable-nodpi/secondary_backdrop.png
          test -f app/src/main/res/font/theunkwn_hacker.ttf
          echo "Android project verification passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          expected='498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Gradle wrapper JAR checksum mismatch."
            exit 1
          fi
          chmod +x gradlew build-with-bundled-gradle.sh
          echo "Gradle wrapper checksum verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore and validate release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Required GitHub Actions secret is missing: corresponding ANDROID_* secret for $name."
              exit 1
            fi
          done

          export KEYSTORE_OUTPUT="$RUNNER_TEMP/theunkwn-release.jks"
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          encoded = os.environ["KEYSTORE_BASE64"]
          # GitHub secrets may contain wrapped base64 lines; remove whitespace only.
          compact = re.sub(r"\s+", "", encoded)
          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as exc:
              print(f"ERROR: ANDROID_KEYSTORE_BASE64 is not valid base64 ({type(exc).__name__}).")
              sys.exit(1)
          if not decoded:
              print("ERROR: Decoded keystore is empty.")
              sys.exit(1)
          with open(os.environ["KEYSTORE_OUTPUT"], "wb") as keystore:
              keystore.write(decoded)
          os.chmod(os.environ["KEYSTORE_OUTPUT"], 0o600)
          print("Keystore base64 decoded successfully.")
          PY

          keytool -list -keystore "$RUNNER_TEMP/theunkwn-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/theunkwn-release.jks" >> "$GITHUB_ENV"
          echo "Release keystore and alias validated."

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build-with-bundled-gradle.sh --no-daemon --stacktrace assembleRelease

      - name: Name APK exactly TheUnkwn.apk
        shell: bash
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$source_apk" || { echo "ERROR: Release APK was not created at $source_apk"; exit 1; }
          cp "$source_apk" TheUnkwn.apk
          sha256sum TheUnkwn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheUnkwn
          path: TheUnkwn.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: TheUnkwn ${{ github.ref_name }}
          generate_release_notes: true
          files: TheUnkwn.apk
          fail_on_unmatched_files: true
