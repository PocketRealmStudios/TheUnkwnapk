
name: TheUnkwn Android Release

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f app/build.gradle.kts && -f TheUnkwn.zip ]]; then
            mkdir -p "$RUNNER_TEMP/theunkwn-project"
            unzip -oq TheUnkwn.zip -d "$RUNNER_TEMP/theunkwn-project"
            cp -a "$RUNNER_TEMP/theunkwn-project/." .
          fi

      - name: Verify project and artwork
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/drawable-nodpi/brand_backdrop.webp
          test -f app/src/main/res/drawable-nodpi/secondary_backdrop.png
          test -f app/src/main/res/font/theunkwn_hacker.ttf
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Restore private release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/theunkwn-upload.jks"
          test -s "$RUNNER_TEMP/theunkwn-upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/theunkwn-upload.jks" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test "$KEY_ALIAS" = "theunkwn-upload"

      - name: Build signed APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Verify release signatures
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TheUnkwn-release-signed-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: TheUnkwn-google-play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
