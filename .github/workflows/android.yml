
name: Release TheUnkwn APK and AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

concurrency:
  group: theunkwn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-apk:
    name: Build TheUnkwn APKs and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Extract and verify Android project
        shell: bash
        run: |
          set -euo pipefail
          archive='./TheUnkwn.zip'
          if [[ -f "$archive" ]]; then
            # Keep the archive name exact and extract into a clearly named folder.
            extraction_dir="$RUNNER_TEMP/TheUnkwn"
            rm -rf "$extraction_dir"
            mkdir -p "$extraction_dir"
            echo "Extracting TheUnkwn.zip into folder: TheUnkwn/"
            unzip -oq "$archive" -d "$extraction_dir"
            rm -rf "$extraction_dir/.github/workflows"
            cp -a "$extraction_dir/." .
          elif [[ ! -f app/build.gradle.kts && ! -f app/build.gradle ]]; then
            echo "ERROR: TheUnkwn.zip was not found and the Android app module is missing. Add exactly TheUnkwn.zip or commit the extracted project files at the repository root."
            exit 1
          fi

          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f settings.gradle.kts -o -f settings.gradle
          test -f build.gradle.kts -o -f build.gradle
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f build-with-bundled-gradle.sh
          test -f app/src/main/res/drawable-nodpi/brand_backdrop.webp
          test -f app/src/main/res/drawable-nodpi/secondary_backdrop.png
          test -f app/src/main/res/font/theunkwn_hacker.ttf
          echo "Android project verification passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          expected='498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17'
          actual="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo "ERROR: Gradle wrapper JAR checksum mismatch."
            exit 1
          fi
          chmod +x gradlew build-with-bundled-gradle.sh
          echo "Gradle wrapper checksum verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            elif [[ -d "$SDK_ROOT/cmdline-tools" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            fi
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android SDK manager not found under $SDK_ROOT or on PATH."
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "Android SDK setup completed."

      - name: Build debug APK
        run: ./build-with-bundled-gradle.sh --no-daemon --stacktrace assembleDebug

      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TheUnkwn-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: TheUnkwn-debug
          path: TheUnkwn-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore and validate release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERROR: Required GitHub Actions secret is missing: corresponding ANDROID_* secret for $name."
              exit 1
            fi
          done

          export KEYSTORE_OUTPUT="$RUNNER_TEMP/theunkwn-release.jks"
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          encoded = os.environ["KEYSTORE_BASE64"]
          # GitHub secrets may contain wrapped base64 lines; remove whitespace only.
          compact = re.sub(r"\s+", "", encoded)
          try:
              decoded = base64.b64decode(compact, validate=True)
          except Exception as exc:
              print(f"ERROR: ANDROID_KEYSTORE_BASE64 is not valid base64 ({type(exc).__name__}).")
              sys.exit(1)
          if not decoded:
              print("ERROR: Decoded keystore is empty.")
              sys.exit(1)
          with open(os.environ["KEYSTORE_OUTPUT"], "wb") as keystore:
              keystore.write(decoded)
          os.chmod(os.environ["KEYSTORE_OUTPUT"], 0o600)
          print("Keystore base64 decoded successfully.")
          PY

          keytool -list -keystore "$RUNNER_TEMP/theunkwn-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/theunkwn-release.jks" >> "$GITHUB_ENV"
          echo "Release keystore and alias validated."

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build-with-bundled-gradle.sh --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Name APK exactly TheUnkwn.apk
        shell: bash
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$source_apk" || { echo "ERROR: Release APK was not created at $source_apk"; exit 1; }
          cp "$source_apk" TheUnkwn.apk
          sha256sum TheUnkwn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: TheUnkwn
          path: TheUnkwn.apk
          if-no-files-found: error
          retention-days: 30

      - name: Name and verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          source_aab='app/build/outputs/bundle/release/app-release.aab'
          test -s "$source_aab"
          cp "$source_aab" TheUnkwn.aab
          jarsigner -verify TheUnkwn.aab
          sha256sum TheUnkwn.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: TheUnkwn-AAB
          path: TheUnkwn.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" TheUnkwn.apk TheUnkwn.aab --clobber
          else
            gh release create "$GITHUB_REF_NAME" TheUnkwn.apk TheUnkwn.aab --verify-tag --generate-notes --title "TheUnkwn $GITHUB_REF_NAME"
          fi

  threat-simulator:
    name: Build TheUnkwn Threat Simulator APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Extract and verify Threat Simulator
        shell: bash
        run: |
          set -euo pipefail
          test -f TheUnkwn-Threat-Simulator.zip || { echo 'Missing TheUnkwn-Threat-Simulator.zip'; exit 1; }
          mkdir -p "$RUNNER_TEMP/TheUnkwn-Threat-Simulator"
          unzip -oq TheUnkwn-Threat-Simulator.zip -d "$RUNNER_TEMP/TheUnkwn-Threat-Simulator"
          cd "$RUNNER_TEMP/TheUnkwn-Threat-Simulator"
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.properties
          echo '498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          chmod +x gradlew

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            if [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
              SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            elif [[ -d "$SDK_ROOT/cmdline-tools" ]]; then
              SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            fi
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android SDK manager not found under $SDK_ROOT or on PATH."
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-35" "build-tools;35.0.0"
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          echo "Android SDK setup completed."

      - name: Build Threat Simulator debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/TheUnkwn-Threat-Simulator"
          ./gradlew --no-daemon --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TheUnkwn-Threat-Simulator.apk"
          test -s "$GITHUB_WORKSPACE/TheUnkwn-Threat-Simulator.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$GITHUB_WORKSPACE/TheUnkwn-Threat-Simulator.apk"

      - uses: actions/upload-artifact@v6
        with:
          name: TheUnkwn-Threat-Simulator
          path: TheUnkwn-Threat-Simulator.apk
          if-no-files-found: error
          retention-days: 30
